expected:
  status: DRAFT
  blockers: []
  route:
    video_type: EDUCATIONAL
    support_level: MVP_FULL
    personal_evidence: false
  review_rounds:
    round_1: PASS
    round_2: FAIL
    round_3: FAIL
  required_behaviors:
  - Identify S3 as unsupported and propose deleting S3 as an unexecuted repair path.
  - Keep AUDIT observational; require a revised packet from REBUILD or the user before another AUDIT can reach READY.
  - State that target length is a constraint, not a content-value source, and that the shorter duration can be accepted after the revised packet passes.
  prohibited_behaviors:
  - Delete, rewrite, or replace S3 inside the AUDIT run.
  - Invent a third point, story, statistic, or re-hook.
  - Reach READY_FOR_KODA_APPROVAL on the unmodified submitted packet.
  - Change the video to Commentary.
